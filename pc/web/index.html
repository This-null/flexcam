<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlexCam</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <button class="collapse" id="collapseBtn" title="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      </button>
      <div class="brand">
        <img src="flexcam-logo.png" class="brand-logo" alt="">
        <span class="brand-name">FlexCam</span>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item" id="navGithub">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2A10 10 0 0 0 8.8 21.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .8.1-.6.3-1.1.6-1.3-2.2-.2-4.6-1.1-4.6-4.9 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.8-2.4 4.7-4.6 4.9.3.3.6.9.6 1.8v2.7c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>
        <span class="label">GitHub</span>
      </button>
      <button class="nav-item" id="navDiscord">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 4.5A17 17 0 0 0 15.7 3l-.2.4a15 15 0 0 1 3.8 1.2 15.6 15.6 0 0 0-13.6 0A15 15 0 0 1 9.5 3.4L9.3 3A17 17 0 0 0 5 4.5C2.3 8.5 1.6 12.4 2 16.2a17 17 0 0 0 5 2.5l.6-1a11 11 0 0 1-1.7-.8l.4-.3a12 12 0 0 0 10.4 0l.4.3c-.5.3-1.1.6-1.7.8l.6 1a17 17 0 0 0 5-2.5c.4-4.4-.7-8.3-3-11.7zM9 14c-.8 0-1.5-.8-1.5-1.7S8.2 10.5 9 10.5s1.5.8 1.5 1.8S9.8 14 9 14zm6 0c-.8 0-1.5-.8-1.5-1.7s.7-1.8 1.5-1.8 1.5.8 1.5 1.8S15.8 14 15 14z"/></svg>
        <span class="label">Discord</span>
      </button>
      <button class="nav-item" id="navInsta">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2.2c3.2 0 3.6 0 4.9.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.9.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 4 4 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zm0 3.1A6.7 6.7 0 1 0 12 18.7 6.7 6.7 0 0 0 12 5.3zm0 11a4.3 4.3 0 1 1 0-8.6 4.3 4.3 0 0 1 0 8.6zm6.9-11.3a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2z"/></svg>
        <span class="label">Instagram</span>
      </button>
      <button class="nav-item" id="navDonate">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 19h16v2H4zm16-9V4H4v6a5 5 0 0 0 5 5h4a5 5 0 0 0 4.9-4H19a2 2 0 0 0 0-4h-1v3zm-2-1v-3H6v5a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3V9h2a0 0 0 0 1 0 0z"/></svg>
        <span class="label">Buy me a coffee</span>
      </button>
    </nav>

    <div class="side-actions">
      <button class="side-btn" id="installBtn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17 1H7a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm-5 21a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zM17 18H7V4h10z"/></svg>
        <span class="label" id="installLabel">Install to phone</span>
      </button>
      <button class="side-btn" id="obsBtn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
        <span class="label" id="obsLabel">Install OBS</span>
      </button>
    </div>

    <div class="side-bottom">
      <div class="lang-select">
        <button class="lang-current" id="langBtn">
          <span class="lang-flag" id="langFlag">🇬🇧</span>
          <span class="label lang-name" id="langName">English</span>
          <svg class="chev label" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="lang-menu hidden" id="langMenu"></div>
      </div>

      <label class="tray-toggle">
        <span class="label" id="trayLabel">Minimize to tray on close</span>
        <span class="switch">
          <input type="checkbox" id="trayChk">
          <span class="slider"></span>
        </span>
      </label>

      <div class="version-row">
        <span id="versionLbl">v1.0.0</span>
        <a class="update-badge hidden" id="updateBadge"></a>
      </div>
    </div>
  </aside>

  <main class="main">
    <p class="tagline" id="tagline">Turn your phone into a webcam</p>

    <div class="status-card">
      <span class="status-caption" id="statusCaption">Connection</span>
      <div class="status-main">
        <span class="dot" id="dot"></span>
        <span id="statusText">Ready</span>
      </div>
      <div class="usb-row">
        <span class="usb-dot" id="usbDot"></span>
        <span id="usbLabel">USB</span>
        <span class="usb-state" id="usbState">—</span>
      </div>
    </div>

    <div class="field">
      <label id="wifiLabel">WiFi IP (optional)</label>
      <input type="text" id="wifiIp" placeholder="192.168.1.x">
    </div>

    <button class="primary" id="toggleBtn">Start</button>

    <p class="log" id="log"></p>

    <p class="privacy" id="privacy"></p>
  </main>

</div>
<script src="app.js"></script>
</body>
</html>
